<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Бюджет-Культура Сочи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a3a5c 0%, #2c5282 100%); min-height: 100vh; display:flex; align-items:center; }
        .login-card { border-radius: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
        .login-logo { font-size: 2rem; font-weight: 700; color: #1a3a5c; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card p-4">
                <div class="text-center mb-4">
                    <div class="login-logo">🏛</div>
                    <h4 class="mt-2 mb-0 fw-bold text-dark">Бюджет-Культура Сочи</h4>
                    <p class="text-muted small">МКУ «ЦБ УК г. Сочи»</p>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger small">
                    Неверный логин или пароль.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Логин</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" placeholder="username" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Пароль</label>
                        <input type="password" name="password" id="id_password"
                               class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100 fw-semibold">
                        Войти в систему
                    </button>
                </form>
                <hr>
                <p class="text-center text-muted small mb-0">
                    Для получения доступа обратитесь к администратору системы
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
