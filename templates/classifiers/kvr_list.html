{% extends "base.html" %}
{% block title %}Справочник КВР{% endblock %}

{% block content %}
<h4 class="fw-bold mb-4">Справочник КВР</h4>
<p class="text-muted">Коды видов расходов бюджетной классификации</p>

<div class="card p-0">
    <table class="table table-hover mb-0">
        <thead class="table-dark">
            <tr><th class="ps-3">Код</th><th>Наименование</th></tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td class="ps-3"><span class="badge bg-secondary">{{ item.code }}</span></td>
                <td>{{ item.name }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-center text-muted py-4">Нет записей</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
