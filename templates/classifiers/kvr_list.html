{% extends "base.html" %}
{% block title %}Справочник КВР{% endblock %}

{% block content %}
<div class="mb-4">
    <p class="page-title">Справочник КВР</p>
    <p class="page-subtitle">Коды видов расходов бюджетной классификации</p>
</div>

<div class="card">
    <table class="table table-hover mb-0">
        <thead>
            <tr>
                <th class="ps-4" style="width:120px;">Код</th>
                <th>Наименование</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td class="ps-4">
                    <span class="badge" style="background:#F7F6F3;color:#555;border:1px solid #E0E0E0;border-radius:5px;font-size:12px;">
                        {{ item.code }}
                    </span>
                </td>
                <td style="color:#2F3437;">{{ item.name }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center py-5" style="color:#787774;font-size:13px;">
                    Нет записей
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
